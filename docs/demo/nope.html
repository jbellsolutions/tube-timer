}

// One card per slot (paper airplane, drawing, Science Max, What If, space). Start each slot at a random video.
const starts = P.slots.map(s => Math.floor(Math.random() * s.videos.length));
let round = 0;
function render(){
  const cards = $("cards");
  cards.innerHTML = P.slots.map((s, i) => {
    const v = s.videos[(starts[i] + round) % s.videos.length];
    return `<div class="card" data-id="${esc(v.id)}"><div class="tag">${esc(s.label)}</div>` +
      `<img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg">` +
      `<div class="t">${esc(v.title)}</div><div class="c">${esc(v.channel)}</div></div>`;
  }).join("");
  cards.querySelectorAll(".card").forEach(c => c.onclick = () => send("pick", c.dataset.id));
}
$("more").onclick = () => { round++; render(); };
render();

// ---------- parent PIN: close this screen or turn Tube Timer off ----------
if (!P.primary) $("parentBtn").hidden = true;
$("parentBtn").onclick = () => { $("parentBox").hidden = false; $("pinMsg").textContent = ""; $("pinIn").value = ""; $("pinIn").focus(); };
document.querySelectorAll(".pb button").forEach(b => b.onclick = () => {
  if (b.dataset.act === "cancel") { $("parentBox").hidden = true; return; }
  send("parent", JSON.stringify({pin: $("pinIn").value, action: b.dataset.act}));
});
$("pinIn").addEventListener("keydown", e => { if (e.key === "Enter") document.querySelector('.pb button[data-act="end"]').click(); });
window.parentResult = (ok, msg) => { if (!ok) { $("pinMsg").textContent = msg; $("pinIn").value = ""; $("pinIn").focus(); } };
</script>
</body></html>
