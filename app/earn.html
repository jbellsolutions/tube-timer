<!doctype html>
<html><head><meta charset="utf-8"><title>Earn fun time</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1a2e;color:#fff;font-family:"Menlo","Courier New",monospace;user-select:none;-webkit-user-select:none}
body{overflow:auto;background:radial-gradient(circle at 20% 20%,#16365f,#0b1a2e 60%)}
#wrap{min-height:100%;display:flex;align-items:flex-start;justify-content:center;gap:3vw;padding:4vh 3vw}
#left{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
#video{border:6px solid #111;box-shadow:8px 8px 0 #000;background:#000}
#video iframe{display:block;border:0;width:100%;height:100%}
#vtitle{max-width:420px;text-align:center;font-size:14px;color:#9ecbff}
#right{max-width:640px;flex:1;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(30px,4vw,54px);color:#ffd000;text-shadow:4px 4px 0 #000}
#sub{font-size:16px;color:#cfe6ff}
#lock{font-size:18px;font-weight:700;color:#33ff66;background:#0008;padding:8px 12px;border:3px solid #33ff66}
.q{background:#fff;color:#111;border:4px solid #111;box-shadow:5px 5px 0 #33ff66;padding:10px 12px}
.q .t{font-weight:700;margin-bottom:6px}
.q input[type=number],.q textarea{font:16px "Menlo",monospace;padding:6px 8px;border:3px solid #111;width:160px}
.q textarea{width:100%;height:80px;resize:vertical}
.q label{display:block;padding:3px 0;cursor:pointer}
.q .mark{float:right;font-size:20px}
.locked .q{opacity:.45;pointer-events:none}
#check{font:700 20px "Menlo",monospace;padding:14px 22px;background:#ffd000;color:#111;border:5px solid #111;box-shadow:6px 6px 0 #000;cursor:pointer;align-self:flex-start}
#check:disabled{background:#777;cursor:default}
#msg{font-size:17px;font-weight:700;min-height:24px}
#later{position:fixed;top:14px;right:14px;font:700 14px "Menlo",monospace;padding:8px 12px;background:#0008;color:#fff;border:2px solid #fff;cursor:pointer;z-index:5}
#done{display:none;position:fixed;inset:0;background:#0b1a2ef2;z-index:9;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#done h2{font-size:clamp(40px,6vw,80px);color:#ffd000;margin:0;text-shadow:5px 5px 0 #000}
#done p{font-size:22px}
</style></head>
<body>
<button id="later">✖ Not now</button>
<div id="wrap">
  <div id="left"><div id="video"><iframe allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div><div id="vtitle"></div></div>
  <div id="right" class="locked">
    <h1>🧠 EARN <span id="mins">20</span> MORE MINUTES</h1>
    <div id="sub">Watch the whole video, then answer the 5 questions. This video does <b>not</b> use up your YouTube time.</div>
    <div id="lock"></div>
    <div id="qs"></div>
    <div id="msg"></div>
    <button id="check" disabled>✅ Check my answers</button>
  </div>
</div>
<div id="done"><h2>🎉 YOU EARNED IT!</h2><p id="donemsg"></p></div>
<script>
const P = Object.assign({earnMinutes: 20, used: 0, inWindow: true, funWindow: "4:00 PM–8:30 PM", primary: true, challenge: {
  id: "Sw-pRuuV1us", title: "Unlock the 11 Times Table Trick", channel: "Tang Math", seconds: 20, vertical: true,
  questions: [{q: "23 × 11 = ?", answer: 253}, {q: "Pick one", choices: ["right", "wrong"], answer: 0}],
  explain: "Explain the trick."}}, window.PARAMS || {});
const send = (kind, value) => { try { window.webkit.messageHandlers.msg.postMessage({kind, value}); } catch(e) { console.log(kind, value); } };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const c = P.challenge;
if (!P.primary) document.body.innerHTML = "";

$("mins").textContent = P.earnMinutes;
$("later").onclick = () => send("cancel", "");

// Video (plays inside this screen, so it doesn't count as YouTube time)
const box = $("video");
const h = Math.min(innerHeight * 0.78, 700);
if (c.vertical) { box.style.height = h + "px"; box.style.width = (h * 9 / 16) + "px"; }
else { box.style.width = Math.min(innerWidth * 0.5, 720) + "px"; box.style.aspectRatio = "16/9"; }
box.querySelector("iframe").src = `https://www.youtube-nocookie.com/embed/${c.id}?autoplay=1&rel=0&playsinline=1&modestbranding=1`;
$("vtitle").textContent = `${c.title} · ${c.channel}`;

// Questions: 4 checked automatically + 1 "explain it" (saved for a parent to read)
const order = c.questions.map(q => q.choices ? q.choices.map((t, i) => ({t, i})).sort(() => Math.random() - .5) : null);
$("qs").innerHTML = c.questions.map((q, n) => `<div class="q" id="q${n}"><span class="mark"></span><div class="t">${n+1}. ${esc(q.q)}</div>` +
  (q.choices ? order[n].map(o => `<label><input type="radio" name="r${n}" value="${o.i}"> ${esc(o.t)}</label>`).join("")
             : `<input type="number" inputmode="numeric" id="a${n}">`) + `</div>`).join("") +
  `<div class="q" id="qx"><span class="mark"></span><div class="t">${c.questions.length+1}. ${esc(c.explain)}</div><textarea id="ax" placeholder="Write it in your own words…"></textarea></div>`;

// Questions unlock after the video's length (so he actually watches it)
const unlockAt = Date.now() + c.seconds * 1000;
function lockTick(){
  const s = Math.ceil((unlockAt - Date.now()) / 1000);
  if (s > 0) { $("lock").textContent = `🔒 Questions unlock in ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}. Watch the video!`; return; }
  $("lock").textContent = "🔓 Questions unlocked. You can rewatch the video if you need to!";
  $("right").classList.remove("locked"); $("check").disabled = cooldown > Date.now();
  clearInterval(lt);
}
let cooldown = 0;
const lt = setInterval(lockTick, 500); lockTick();

$("check").onclick = () => {
  let allRight = true;
  c.questions.forEach((q, n) => {
    let given;
    if (q.choices) { const r = document.querySelector(`input[name=r${n}]:checked`); given = r ? Number(r.value) : NaN; }
    else given = Number(($("a" + n).value || "").trim());
    const ok = given === q.answer;
    allRight = allRight && ok;
    $("q" + n).querySelector(".mark").textContent = ok ? "✅" : "❌";
  });
  const words = ($("ax").value || "").trim().split(/\s+/).filter(Boolean).length;
  const explained = words >= 6;
  $("qx").querySelector(".mark").textContent = explained ? "✅" : "✏️";
  if (allRight && explained) {
    send("earned", $("ax").value.trim());
    $("donemsg").textContent = `+${P.earnMinutes} minutes of fun time! ` + (P.inWindow ? "Go have fun! 🎉" : `Use it during fun time (${P.funWindow}). 🕓`);
    $("done").style.display = "flex";
    return;
  }
  $("msg").textContent = !allRight ? "Not quite! Fix the ❌ ones. Rewatch the video if you need to. Try again in 30 seconds."
                                   : "Write a little more for the last one (at least one full sentence).";
  if (!allRight) {
    cooldown = Date.now() + 30000; $("check").disabled = true;
    setTimeout(() => { $("check").disabled = false; }, 30000);
  }
};
</script>
</body></html>
