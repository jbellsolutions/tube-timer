<!doctype html>
<html><head><meta charset="utf-8"><title>Get up!</title>
<style>
/* Version 2 get-up break: nothing to watch. A black screen, music in the background, and the parent button. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:default;user-select:none;-webkit-user-select:none}
#parentBtn{position:fixed;left:14px;bottom:14px;font:700 12px "Menlo",monospace;padding:6px 10px;border:2px solid #333;
  background:#111;color:#777;cursor:pointer}
#parentBtn:hover{color:#ddd;border-color:#777}
#parentBox{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center}
#parentBox[hidden]{display:none}
.pb{background:#fff;color:#111;border:5px solid #111;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:300px;
  text-align:center;font-family:"Menlo",monospace}
.pb b{font-size:20px}
.pb input{font:700 28px "Menlo",monospace;text-align:center;letter-spacing:10px;padding:8px;border:3px solid #111}
#pinMsg{min-height:18px;color:#c00;font-weight:700}
.pb button{font:700 14px "Menlo",monospace;padding:9px 12px;border:3px solid #111;background:#ffd000;color:#111;cursor:pointer}
.pb button.alt{background:#eee}
</style></head>
<body>
<button id="parentBtn">🔒 PIN</button>
<div id="parentBox" hidden><div class="pb">
  <b>🔒 Enter a PIN</b>
  <input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <div id="pinMsg"></div>
  <button data-act="kid10">🧒 +10 minutes</button>
  <button data-act="end">End this break</button>
  <button data-act="off">Turn Tube Timer off</button>
  <button data-act="cancel" class="alt">Cancel</button>
</div></div>
<script>
const P = Object.assign({musicSeconds: 60, primary: true}, window.PARAMS || {});
const $ = id => document.getElementById(id);
const send = (kind, value) => { try { window.webkit.messageHandlers.msg.postMessage({kind, value}); } catch(e) { console.log(kind, value); } };

// ---------- parent PIN: end the break or turn Tube Timer off ----------
if (!P.primary) $("parentBtn").hidden = true;
$("parentBtn").onclick = () => { $("parentBox").hidden = false; $("pinMsg").textContent = ""; $("pinIn").value = ""; $("pinIn").focus(); };
document.querySelectorAll(".pb button").forEach(b => b.onclick = () => {
  if (b.dataset.act === "cancel") { $("parentBox").hidden = true; return; }
  send("parent", JSON.stringify({pin: $("pinIn").value, action: b.dataset.act}));
});
$("pinIn").addEventListener("keydown", e => { if (e.key === "Enter") document.querySelector('.pb button[data-act="kid10"]').click(); });
window.parentResult = (ok, msg) => { if (!ok) { $("pinMsg").textContent = msg; $("pinIn").value = ""; $("pinIn").focus(); } };

// ---------- music: a built-in disco groove for about a minute, then it fades out ----------
// Generated right here (no videos, no ads, nothing to look at). Four-on-the-floor kick, claps, hats,
// a bouncing bass line and chord stabs over Am–F–C–G, with the parts coming in and out so it keeps moving.
function party(seconds) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0.4; master.connect(ctx.destination);
  const noise = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
  const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const env = (g, t, a, len) => { g.gain.setValueAtTime(a, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len); };
  const kick = t => { const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    env(g, t, 1, 0.25); o.connect(g).connect(master); o.start(t); o.stop(t + 0.26); };
  const hiss = (t, freq, vol, len) => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = freq > 4000 ? "highpass" : "bandpass"; f.frequency.value = freq;
    env(g, t, vol, len); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + len + 0.02); };
  const tone = (t, freq, type, vol, len, cutoff) => { const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; f.type = "lowpass"; f.frequency.value = cutoff || 2400;
    env(g, t, vol, len); o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + len + 0.02); };
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];   // Am F C G
  const BASS = [0, 12, 0, 12, 7, 12, 0, 10];                                 // octave-bounce disco bass
  const s16 = 60 / 118 / 4;
  let step = 0, next = ctx.currentTime + 0.1;
  const stopAt = ctx.currentTime + seconds;
  const timer = setInterval(() => {
    while (next < ctx.currentTime + 0.2) {
      const bar = Math.floor(step / 16), chord = CHORDS[bar % 4], beat = step % 16;
      const section = Math.floor(bar / 4) % 4;                 // 0 groove, 1 + chords, 2 breakdown, 3 everything
      if (beat % 4 === 0 && section !== 2) kick(next);
      if (beat === 4 || beat === 12) hiss(next, 1800, 0.35, 0.12);           // clap
      if (beat % 4 === 2) hiss(next, 8000, 0.18, 0.05);                       // open-ish hat on the off-beat
      if (beat % 2 === 0) tone(next, hz(chord[0] - 24 + BASS[(step / 2) % 8 | 0]), "sawtooth", 0.22, s16 * 1.6, 900);
      if ((section === 1 || section === 3) && (beat === 2 || beat === 6 || beat === 10 || beat === 14))
        chord.forEach(n => tone(next, hz(n), "square", 0.05, s16 * 1.2, 2600));
      if (section >= 2 && beat % 4 === 0) tone(next, hz(chord[(bar + beat / 4) % 3] + 12), "triangle", 0.08, s16 * 3);
      next += s16; step++;
    }
    if (ctx.currentTime > stopAt) {                            // a minute is up: fade out, then silence
      master.gain.setTargetAtTime(0, ctx.currentTime, 1.2);
      clearInterval(timer);
      setTimeout(() => ctx.close(), 6000);
    }
  }, 50);
  if (ctx.state === "suspended") ctx.resume();
}
if (P.primary) party(P.musicSeconds || 60);
</script>
</body></html>
